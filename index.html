<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova the Robot</title>
    <style>
        body {
            background-color: #1a1a24;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .robot-container {
            text-align: center;
            position: relative;
            transition: transform 0.1s ease-out;
        }

        /* Floating body idle animation */
        .robot-head {
            width: 200px;
            height: 180px;
            background: linear-gradient(145deg, #3a3d40, #181a1b);
            border: 4px solid #00d2ff;
            border-radius: 30px;
            position: relative;
            margin: 0 auto 20px auto;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
            animation: float 3s ease-in-out infinite alternate;
            transition: border-color 0.5s, box-shadow 0.5s;
        }

        /* Antenna */
        .antenna {
            width: 8px;
            height: 40px;
            background-color: #00d2ff;
            position: absolute;
            top: -44px;
            left: 50%;
            transform: translateX(-50%);
            transition: background-color 0.5s;
        }

        .antenna-tip {
            width: 20px;
            height: 20px;
            background-color: #00d2ff;
            border-radius: 50%;
            position: absolute;
            top: -55px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 15px #00d2ff;
            animation: blink 1.5s infinite alternate;
            transition: background-color 0.5s, box-shadow 0.5s;
        }

        /* Eyes Screen */
        .screen {
            width: 160px;
            height: 80px;
            background-color: #0b0c10;
            border-radius: 15px;
            margin: 30px auto 0 auto;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
            box-sizing: border-box;
        }

        /* Robot Eyes */
        .eye {
            width: 35px;
            height: 35px;
            background-color: #00d2ff;
            border-radius: 50%;
            box-shadow: 0 0 15px #00d2ff;
            animation: eyeBlink 4s infinite;
            transition: all 0.3s ease;
        }

        /* Mouth */
        .mouth {
            width: 60px;
            height: 6px;
            background-color: #00d2ff;
            border-radius: 3px;
            margin: 25px auto 0 auto;
            box-shadow: 0 0 8px #00d2ff;
            transition: all 0.3s ease;
        }

        /* Name Tag */
        .robot-name {
            color: #ffffff;
            font-size: 2rem;
            letter-spacing: 2px;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00d2ff;
            transition: text-shadow 0.5s;
        }

        /* Control Panel Buttons */
        .controls {
            margin-top: 30px;
            display: flex;
            gap: 10px;
        }

        button {
            background-color: #252830;
            color: #fff;
            border: 2px solid #3a3d40;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        button:hover {
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        /* Emotional Overrides */
        /* Happy */
        .happy .robot-head { border-color: #00ff88; box-shadow: 0 0 20px rgba(0, 255, 136, 0.3); }
        .happy .antenna, .happy .antenna-tip { background-color: #00ff88; }
        .happy .antenna-tip { box-shadow: 0 0 15px #00ff88; }
        .happy .eye { background-color: #00ff88; box-shadow: 0 0 15px #00ff88; border-radius: 50% 50% 0 0; height: 20px; }
        .happy .mouth { background-color: #00ff88; box-shadow: 0 0 8px #00ff88; height: 15px; border-radius: 0 0 30px 30px; width: 50px; }
        .happy .robot-name { text-shadow: 0 0 10px #00ff88; }

        /* Sad */
        .sad .robot-head { border-color: #0066ff; box-shadow: 0 0 20px rgba(0, 102, 255, 0.3); }
        .sad .antenna, .sad .antenna-tip { background-color: #0066ff; }
        .sad .antenna-tip { box-shadow: 0 0 15px #0066ff; }
        .sad .eye { background-color: #0066ff; box-shadow: 0 0 15px #0066ff; border-radius: 0 0 50% 50%; height: 20px; transform: rotate(10deg); }
        .sad .eye:first-child { transform: rotate(-10deg); }
        .sad .mouth { background-color: #0066ff; box-shadow: 0 0 8px #0066ff; height: 10px; border-radius: 30px 30px 0 0; width: 40px; }
        .sad .robot-name { text-shadow: 0 0 10px #0066ff; }

        /* Angry */
        .angry .robot-head { border-color: #ff3333; box-shadow: 0 0 20px rgba(255, 51, 51, 0.3); animation: shake 0.2s infinite; }
        .angry .antenna, .angry .antenna-tip { background-color: #ff3333; }
        .angry .antenna-tip { box-shadow: 0 0 15px #ff3333; }
        .angry .eye { background-color: #ff3333; box-shadow: 0 0 15px #ff3333; clip-path: polygon(0 30%, 100% 0, 100% 100%, 0 100%); }
        .angry .eye:first-child { clip-path: polygon(0 0, 100% 30%, 100% 100%, 0 100%); }
        .angry .mouth { background-color: #ff3333; box-shadow: 0 0 8px #ff3333; width: 70px; height: 4px; }
        .angry .robot-name { text-shadow: 0 0 10px #ff3333; }

        /* Animations */
        @keyframes blink {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        @keyframes eyeBlink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }
        @keyframes float {
            0% { transform: translateY(0); }
            100% { transform: translateY(-15px); }
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
    </style>
</head>
<body>

    <div class="robot-container" id="novaContainer">
        <div class="robot-head">
            <div class="antenna-tip"></div>
            <div class="antenna"></div>
            <div class="screen">
                <div class="eye"></div>
                <div class="eye"></div>
            </div>
            <div class="mouth"></div>
        </div>
        <h1 class="robot-name">Nova</h1>
    </div>

    <!-- UI Interaction Panel -->
    <div class="controls">
        <button onclick="setEmotion('happy')">😊 Happy</button>
        <button onclick="setEmotion('sad')">😢 Sad</button>
        <button onclick="setEmotion('angry')">😠 Angry</button>
        <button onclick="setEmotion('default')">🤖 Neutral</button>
    </div>

    <script>
        const container = document.getElementById('novaContainer');

        // 1. Emotion Handler
        function setEmotion(emotion) {
            // Remove previous emotion classes
            container.classList.remove('happy', 'sad', 'angry');
            
            if (emotion !== 'default') {
                container.classList.add(emotion);
            }
        }

        // 2. Movement Logic (Nova follows your mouse cursor)
        document.addEventListener('mousemove', (e) => {
            // Calculate mouse position relative to window center
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            
            // Move and slightly tilt the robot container towards the mouse
            container.style.transform = `translate(${-xAxis}px, ${-yAxis}px) rotateY(${-xAxis}deg) rotateX(${yAxis}deg)`;
        });
    </script>
</body>
</html>
